
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>STROBO ULTIMATE V6</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    user-select:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#panel{
    position:fixed;
    z-index:10;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    width:min(400px,92%);
    padding:24px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    background:rgba(8,10,16,.88);
    backdrop-filter:blur(20px);
    text-align:center;
    box-shadow:0 15px 50px #000;
    transition:.4s;
}

#panel.hide{
    opacity:0;
    transform:translate(-50%,30px);
    pointer-events:none;
}

.logo{
    color:#00ffaa;
    font-size:20px;
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:22px;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:11px;
    background:linear-gradient(120deg,#00ffaa,#00aaff);
    color:#00110b;
    font-weight:900;
    font-size:14px;
    letter-spacing:2px;
    cursor:pointer;
}

button.active{
    background:linear-gradient(120deg,#ff3366,#ff8800);
    color:white;
}

button:disabled{
    opacity:.5;
}

#status{
    margin-top:15px;
    color:#888;
    font-size:11px;
    letter-spacing:1px;
}

#meter{
    height:5px;
    background:#222;
    border-radius:10px;
    margin-top:18px;
    overflow:hidden;
}

#meter-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00ffaa,#00aaff,#ff00cc);
    border-radius:10px;
    transition:width .06s linear;
}

#top{
    position:fixed;
    z-index:2;
    top:22px;
    left:0;
    width:100%;
    text-align:center;
    color:#666;
    font-size:10px;
    letter-spacing:4px;
    pointer-events:none;
}

#frequency{
    color:#00ffaa;
    font-weight:bold;
}

@media(max-width:500px){
    #panel{bottom:15px;padding:20px}
    .logo{font-size:17px}
}
</style>
</head>

<body>

<canvas id="visualizer"></canvas>

<div id="top">AUDIO REACTIVE VISUALIZER</div>

<div id="panel">

    <div class="logo">STROBO ULTIMATE</div>
    <div class="subtitle">BASS DETECTION SYSTEM V6</div>

    <button id="toggle">LIGAR ENGINE</button>

    <div id="status">AGUARDANDO MICROFONE</div>

    <div id="meter">
        <div id="meter-fill"></div>
    </div>

</div>

<script>

// ========================================
// 1. ELEMENTOS
// ========================================

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const button = document.getElementById("toggle");
const panel = document.getElementById("panel");
const status = document.getElementById("status");
const meter = document.getElementById("meter-fill");

let W,H,DPR;

let audio = null;
let analyser = null;
let stream = null;
let source = null;
let data = null;

let running = false;
let raf = null;
let hideTimer = null;

let particles = [];
let rings = [];
let waves = [];

let hue = 160;

let bass = 0;
let bassPrevious = 0;
let energy = 0;
let targetEnergy = 0;

let average = 0;
let beatStrength = 0;

let lastBeat = 0;
let lastFrame = 0;

const MAX_PARTICLES = 350;
const MAX_RINGS = 8;
const MAX_WAVES = 12;

// ========================================
// 2. TELA
// ========================================

function resize(){

    DPR = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR,0,0,DPR,0,0);

    clearScreen();
}

window.addEventListener("resize",resize);

function clearScreen(){

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
}

resize();

// ========================================
// 3. INTERFACE
// ========================================

function showPanel(){

    panel.classList.remove("hide");

    clearTimeout(hideTimer);

    if(running){

        hideTimer=setTimeout(()=>{

            panel.classList.add("hide");

        },4500);
    }
}

window.addEventListener("mousemove",showPanel);
window.addEventListener("touchstart",showPanel);

// ========================================
// 4. INICIALIZAR MICROFONE
// ========================================

async function startEngine(){

    button.disabled=true;

    status.textContent="CONECTANDO MICROFONE...";

    try{

        if(!navigator.mediaDevices ||
           !navigator.mediaDevices.getUserMedia){

            throw new Error(
                "Utilize HTTPS ou localhost para acessar o microfone."
            );
        }

        stream=await navigator.mediaDevices.getUserMedia({

            audio:{
                echoCancellation:false,
                noiseSuppression:false,
                autoGainControl:false
            },

            video:false
        });

        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        audio=new AudioContextClass();

        await audio.resume();

        analyser=audio.createAnalyser();

        // Alta resolução para frequências graves.
        analyser.fftSize=8192;

        analyser.smoothingTimeConstant=0.20;

        analyser.minDecibels=-100;
        analyser.maxDecibels=-15;

        source=audio.createMediaStreamSource(stream);

        source.connect(analyser);

        data=new Uint8Array(analyser.frequencyBinCount);

        particles=[];
        rings=[];
        waves=[];

        bass=0;
        bassPrevious=0;
        energy=0;
        targetEnergy=0;
        average=0;
        beatStrength=0;
        lastBeat=0;
        lastFrame=0;

        running=true;

        button.textContent="DESLIGAR ENGINE";
        button.classList.add("active");

        status.textContent="MICROFONE CONECTADO • ENGINE ATIVA";

        clearScreen();

        showPanel();

        raf=requestAnimationFrame(render);

    }catch(error){

        console.error(error);

        alert(
            "Não foi possível iniciar o sistema.\n\n"+
            error.message+
            "\n\nVerifique a permissão do microfone."
        );

        await stopEngine();
    }

    button.disabled=false;
}

// ========================================
// 5. DESLIGAR
// ========================================

async function stopEngine(){

    running=false;

    if(raf!==null){

        cancelAnimationFrame(raf);
        raf=null;
    }

    clearTimeout(hideTimer);

    if(stream){

        stream.getTracks().forEach(track=>track.stop());

        stream=null;
    }

    if(audio){

        const oldAudio=audio;

        audio=null;

        await oldAudio.close().catch(console.error);
    }

    analyser=null;
    source=null;
    data=null;

    particles=[];
    rings=[];
    waves=[];

    energy=0;
    bass=0;

    meter.style.width="0%";

    button.textContent="LIGAR ENGINE";
    button.classList.remove("active");

    status.textContent="ENGINE DESLIGADA";

    panel.classList.remove("hide");

    clearScreen();
}

// ========================================
// 6. DETECTOR INTELIGENTE DE GRAVES
// ========================================

function detectBass(dt){

    analyser.getByteFrequencyData(data);

    const binHz=audio.sampleRate/analyser.fftSize;

    // Faixa principal do bumbo.
    const ranges=[
        [35,75],
        [75,120],
        [120,160]
    ];

    let low=0;
    let mid=0;
    let upper=0;

    function getBand(min,max){

        const first=Math.max(1,Math.floor(min/binHz));
        const last=Math.min(
            data.length-1,
            Math.ceil(max/binHz)
        );

        let total=0;
        let count=0;

        for(let i=first;i<=last;i++){

            total+=data[i]/255;
            count++;
        }

        return count?total/count:0;
    }

    low=getBand(ranges[0][0],ranges[0][1]);
    mid=getBand(ranges[1][0],ranges[1][1]);
    upper=getBand(ranges[2][0],ranges[2][1]);

    // Prioriza frequências mais graves.
    const volume=
        low*.65+
        mid*.25+
        upper*.10;

    bassPrevious=bass;

    bass+=(volume-bass)*.45;

    const increase=bass-bassPrevious;

    // Média adaptativa do ambiente.
    average+=(bass-average)*.025;

    const threshold=Math.max(
        .025,
        average*1.45
    );

    const now=performance.now();

    // Identificação de batidas.
    if(
        bass>threshold &&
        increase>.003 &&
        low>.025 &&
        now-lastBeat>180
    ){

        lastBeat=now;

        beatStrength=Math.min(
            1,
            Math.max(.2,bass*4)
        );

        // Intensidade acompanha a força do grave.
        targetEnergy=Math.min(
            1,
            Math.max(.12,bass*4.5)
        );

        hue=(hue+35+beatStrength*25)%360;

        createEffects(beatStrength);
    }

    // Resposta contínua à música.
    const continuousEnergy=Math.min(1,bass*3.5);

    targetEnergy=Math.max(
        targetEnergy*.96,
        continuousEnergy*.65
    );

    // Suavização da iluminação.
    energy+=(targetEnergy-energy)*.35;

    targetEnergy*=Math.pow(.90,dt/16.67);

    beatStrength*=Math.pow(.91,dt/16.67);

    return volume;
}

// ========================================
// 7. CRIAR EFEITOS
// ========================================

function createEffects(power){

    const cx=W/2;
    const cy=H/2;

    const amount=Math.floor(15+power*35);

    for(let i=0;i<amount;i++){

        if(particles.length>=MAX_PARTICLES)break;

        const angle=Math.random()*Math.PI*2;

        const speed=(2+Math.random()*8)*(.5+power);

        particles.push({

            x:cx,
            y:cy,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            size:2+Math.random()*5,

            alpha:1,

            hue:hue
        });
    }

    if(rings.length<MAX_RINGS){

        rings.push({

            radius:10,
            alpha:.8,
            hue:hue,
            speed:1+power
        });
    }

    if(waves.length<MAX_WAVES){

        waves.push({

            radius:5,
            alpha:.7,
            hue:hue
        });
    }
}

// ========================================
// 8. ILUMINAÇÃO AMBIENTE
// ========================================

function drawLighting(dt){

    // Fundo preto com rastros suaves.
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.fillRect(0,0,W,H);

    if(energy>.005){

        const radius=100+energy*Math.max(W,H)*.75;

        const gradient=ctx.createRadialGradient(
            W/2,H/2,5,
            W/2,H/2,radius
        );

        gradient.addColorStop(
            0,
            `hsla(${hue},100%,45%,${energy*.30})`
        );

        gradient.addColorStop(
            .45,
            `hsla(${hue},100%,30%,${energy*.12})`
        );

        gradient.addColorStop(1,"transparent");

        ctx.fillStyle=gradient;

        ctx.fillRect(0,0,W,H);
    }

    // Brilho circular central.
    if(energy>.02){

        const radius=30+energy*120;

        ctx.beginPath();

        ctx.arc(
            W/2,H/2,radius,
            0,Math.PI*2
        );

        ctx.strokeStyle=
            `hsla(${hue},100%,65%,${energy*.65})`;

        ctx.lineWidth=2+energy*7;

        ctx.stroke();
    }
}

// ========================================
// 9. PARTÍCULAS
// ========================================

function drawParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        const factor=dt/16.67;

        p.x+=p.vx*factor;
        p.y+=p.vy*factor;

        p.vx*=Math.pow(.975,factor);
        p.vy*=Math.pow(.975,factor);

        p.alpha*=Math.pow(.96,factor);

        ctx.beginPath();

        ctx.arc(
            p.x,p.y,p.size,
            0,Math.PI*2
        );

        ctx.fillStyle=
            `hsla(${p.hue},100%,65%,${p.alpha})`;

        ctx.fill();

        if(p.alpha<.02){

            particles.splice(i,1);
        }
    }
}

// ========================================
// 10. ANÉIS DE ENERGIA
// ========================================

function drawRings(dt){

    for(let i=rings.length-1;i>=0;i--){

        const r=rings[i];

        r.radius+=
            (Math.max(W,H)-r.radius)*.045*dt/16.67;

        r.alpha*=Math.pow(.965,dt/16.67);

        ctx.beginPath();

        ctx.arc(
            W/2,H/2,r.radius,
            0,Math.PI*2
        );

        ctx.strokeStyle=
            `hsla(${r.hue},100%,65%,${r.alpha})`;

        ctx.lineWidth=4*r.alpha;

        ctx.stroke();

        if(r.alpha<.02){

            rings.splice(i,1);
        }
    }
}

// ========================================
// 11. ONDAS
// ========================================

function drawWaves(dt){

    for(let i=waves.length-1;i>=0;i--){

        const w=waves[i];

        w.radius+=3*dt/16.67;

        w.alpha*=Math.pow(.96,dt/16.67);

        ctx.beginPath();

        ctx.ellipse(
            W/2,
            H/2,
            w.radius,
            w.radius*.45,
            0,
            0,
            Math.PI*2
        );

        ctx.strokeStyle=
            `hsla(${w.hue},100%,65%,${w.alpha})`;

        ctx.lineWidth=2;

        ctx.stroke();

        if(w.alpha<.02){

            waves.splice(i,1);
        }
    }
}

// ========================================
// 12. LOOP PRINCIPAL
// ========================================

function render(timestamp){

    if(!running)return;

    raf=requestAnimationFrame(render);

    const dt=lastFrame
        ?Math.min(timestamp-lastFrame,40)
        :16.67;

    lastFrame=timestamp;

    const volume=detectBass(dt);

    // Indicador de intensidade.
    meter.style.width=
        Math.min(100,volume*400)+"%";

    drawLighting(dt);
    drawWaves(dt);
    drawRings(dt);
    drawParticles(dt);
}

// ========================================
// 13. BOTÃO
// ========================================

button.addEventListener("click",()=>{

    if(running){

        stopEngine();

    }else{

        startEngine();
    }
});

// ========================================
// 14. INICIALIZAÇÃO
// ========================================

clearScreen();

</script>

</body>
</html>
